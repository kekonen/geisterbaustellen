<!doctype html>
<html lang="{{ .Site.Language.Lang }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ block "title" . }}{{ .Site.Title }}{{ end }}</title>
<meta name="description" content="{{ i18n "subtitle" }}">
<link rel="icon" href="/svg/fence-row.svg" type="image/svg+xml">
{{ block "head" . }}{{ end }}
<style>
:root {
  --bg: #fff;
  --fg: #111;
  --accent: #a32a2a;
  --muted: #555;
  --rule: #ddd;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  font-family: Georgia, "Times New Roman", serif;
  color: var(--fg);
  background: var(--bg);
  line-height: 1.55;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}
header, main, footer {
  max-width: 640px;
  margin: 0 auto;
  padding: 0 1.25rem;
}
header { padding-top: 2.5rem; padding-bottom: 0.5rem; }
main { padding-bottom: 2rem; flex: 1 0 auto; }
footer { padding-top: 0.5rem; padding-bottom: 2.5rem; }
.topbar {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 0.75rem;
}
h1 {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  font-size: 1.5rem;
  margin: 0 0 0.25rem;
  font-weight: 700;
  letter-spacing: -0.01em;
}
h1 a { color: inherit; text-decoration: none; }
.lang-toggle { flex-shrink: 0; padding-top: 0.3rem; }
.lang-toggle a {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  font-size: 0.78rem;
  color: var(--muted);
  text-decoration: none;
  border: 1px solid var(--rule);
  padding: 0.2rem 0.55rem;
  letter-spacing: 0.06em;
}
.lang-toggle a:hover { color: var(--fg); border-color: var(--muted); }
.subtitle {
  margin: 0 0 1rem;
  color: var(--muted);
  font-style: italic;
  border-bottom: 2px solid var(--accent);
  padding-bottom: 1rem;
}
.leaderboard { list-style: none; margin: 0; padding: 0; }
.entry {
  display: flex;
  gap: 1rem;
  padding: 1.5rem 0;
  border-bottom: 1px solid var(--rule);
}
.entry:last-child { border-bottom: none; }
.rank {
  font-size: 1.1rem;
  color: var(--muted);
  min-width: 3.2rem;
  flex-shrink: 0;
  font-variant-numeric: tabular-nums;
  padding-top: 0.15rem;
}
.medal { font-style: normal; margin-right: 0.15rem; }
.entry-body { flex: 1; min-width: 0; }
.address {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  font-size: 1.2rem;
  margin: 0;
  font-weight: 600;
  letter-spacing: -0.005em;
}
.address a { color: inherit; text-decoration: none; border-bottom: 1px solid transparent; }
.address a:hover { border-bottom-color: var(--accent); }
.locality {
  margin: 0.1rem 0 0.45rem;
  color: var(--muted);
  font-size: 0.9rem;
}
.age {
  margin: 0;
  color: var(--accent);
  font-variant-numeric: tabular-nums;
}
.death {
  margin: 0.1rem 0 0;
  color: var(--muted);
  font-size: 0.85rem;
  font-style: italic;
  font-variant-numeric: tabular-nums;
}
.note {
  margin: 0.4rem 0 0;
  font-style: italic;
  color: var(--muted);
  font-size: 0.95rem;
}
figure { margin: 0; }
.photo-wrap { position: relative; display: inline-block; margin: 0.75rem 0 0; max-width: 100%; line-height: 0; }
.photo { max-width: 100%; height: auto; display: block; }
.photo-wrap.is-deceased .photo { filter: grayscale(1); }
.photo-credit { margin: 0.35rem 0 0; color: var(--muted); font-size: 0.72rem; line-height: 1.35; }
.photo-credit a { color: inherit; text-decoration-thickness: 1px; text-underline-offset: 2px; }
.live-badge {
  position: absolute;
  top: 0.5rem; left: 0.5rem;
  display: inline-flex;
  align-items: center;
  gap: 0.35rem;
  padding: 0.22rem 0.5rem 0.22rem 0.4rem;
  background: rgba(0,0,0,0.72);
  color: #fff;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  font-size: 0.7rem;
  font-weight: 700;
  letter-spacing: 0.12em;
  border-radius: 2px;
  line-height: 1;
}
.live-dot {
  width: 7px; height: 7px;
  background: #e53935;
  border-radius: 50%;
  box-shadow: 0 0 4px rgba(229, 57, 53, 0.7);
  animation: live-pulse 1.4s ease-in-out infinite;
}
@keyframes live-pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
@media (prefers-reduced-motion: reduce) { .live-dot { animation: none; } }
.entry-detail { padding: 1.5rem 0 0; }
.entry-detail .address { font-size: 1.55rem; }
.entry-detail .locality { font-size: 1rem; }
.entry-detail .note { font-size: 1rem; margin-top: 0.6rem; }
.entry-detail .photo-wrap { margin: 1rem 0 0; display: block; }
.entry-detail .photo { width: 100%; }
.entry-content { margin-top: 1.5rem; }
.entry-content p { margin: 0.8rem 0; }
.source-note { margin: 0.8rem 0 0; color: var(--muted); font-size: 0.82rem; }
.source-note a { color: var(--accent); }
.assembly { margin: 0.2rem 0 0.35rem; color: var(--muted); font-size: 0.85rem; font-style: italic; font-variant-numeric: tabular-nums; }
.back-link { margin: 2rem 0 0; font-size: 0.9rem; }
.back-link a { color: var(--muted); text-decoration: none; border-bottom: 1px solid var(--rule); padding-bottom: 1px; }
.back-link a:hover { color: var(--fg); border-color: var(--muted); }
footer {
  border-top: 1px solid var(--rule);
  margin-top: 1rem;
  color: var(--muted);
  font-size: 0.9rem;
}
footer p { margin: 1.25rem 0; }
footer a { color: var(--accent); }
.page-fence { width: 100%; height: 53px; background-image: url('/svg/fence-row.svg'); background-repeat: repeat-x; background-position: center bottom; background-size: auto 100%; margin-top: 0; pointer-events: none; }
@media (max-width: 480px) { .page-fence { height: 36px; } }
.berlin-map { height: 320px; margin: 0 0 1.5rem; border: 1px solid var(--rule); }
@media (max-width: 480px) { .berlin-map { height: 240px; } }
.berlin-map .leaflet-popup-content-wrapper { border-radius: 0; font-family: Georgia, "Times New Roman", serif; box-shadow: 0 1px 6px rgba(0,0,0,0.2); }
.berlin-map .leaflet-popup-tip { box-shadow: 0 1px 6px rgba(0,0,0,0.2); }
.berlin-map .leaflet-popup-content { margin: 0.7rem 0.9rem; font-size: 0.9rem; line-height: 1.4; }
.map-popup-title { display: block; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 1rem; font-weight: 600; color: var(--fg); text-decoration: none; margin-bottom: 0.15rem; }
.map-popup-title:hover { color: var(--accent); }
.berlin-map .leaflet-popup-content .age { display: block; color: var(--accent); font-variant-numeric: tabular-nums; font-size: 0.85rem; margin: 0 0 0.4rem; }
.map-popup-link { font-size: 0.85rem; color: var(--accent); text-decoration: none; }
.map-popup-link:hover { text-decoration: underline; }
.berlin-map .leaflet-control-attribution { font-size: 0.7rem; }
.berlin-map .leaflet-control-attribution a { color: var(--muted); }
.petition { margin: 2rem 0 1rem; padding: 1.25rem 1.25rem 1.1rem; border: 1px solid var(--rule); background: #faf8f4; }
.petition-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; margin: 0 0 0.35rem; font-size: 1rem; font-weight: 700; letter-spacing: -0.005em; }
.petition-rationale { margin: 0 0 0.85rem; font-size: 0.92rem; color: var(--muted); font-style: italic; }
.petition-count { margin: 0 0 0.95rem; font-variant-numeric: tabular-nums; }
.petition-number { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 1.6rem; font-weight: 700; color: var(--accent); margin-right: 0.3rem; }
.petition-noun { color: var(--muted); font-size: 0.9rem; }
.petition-button { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 0.85rem; padding: 0.55rem 1.1rem; background: #1a1a1a; color: #fff; border: none; cursor: pointer; letter-spacing: 0.08em; text-transform: uppercase; }
.petition-button:hover:not(:disabled) { background: var(--accent); }
.petition-button:disabled { opacity: 0.55; cursor: default; }
.petition-thanks { margin: 0.75rem 0 0; font-size: 0.88rem; color: var(--muted); font-style: italic; }
.captcha-modal { position: fixed; inset: 0; background: rgba(20,20,20,0.62); display: flex; align-items: center; justify-content: center; z-index: 1000; padding: 1rem; }
.captcha-modal[hidden] { display: none; }
.captcha-dialog { background: #fff; border: 1px solid #1a1a1a; max-width: 380px; width: 100%; padding: 1.1rem 1.1rem 0.95rem; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
.captcha-title { margin: 0 0 0.35rem; font-size: 0.78rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em; color: #1a1a1a; }
.captcha-instruction { margin: 0 0 0.95rem; font-size: 0.9rem; color: #1a1a1a; line-height: 1.4; }
.captcha-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; margin-bottom: 0.85rem; }
.captcha-cell { background: #fff; border: 2px solid #d8d8d8; padding: 0; cursor: pointer; aspect-ratio: 1; position: relative; transition: border-color 0.08s; }
.captcha-cell img { width: 100%; height: 100%; display: block; }
.captcha-cell:hover { border-color: #999; }
.captcha-cell.selected { border-color: #1773d4; }
.captcha-cell.selected::after { content: "✓"; position: absolute; top: 4px; right: 4px; width: 18px; height: 18px; background: #1773d4; color: #fff; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; line-height: 1; }
.captcha-error { margin: 0 0 0.55rem; color: var(--accent); font-size: 0.82rem; min-height: 1.1em; }
.captcha-actions { display: flex; justify-content: space-between; gap: 0.5rem; }
.captcha-actions button { font-family: inherit; font-size: 0.82rem; padding: 0.5rem 0.95rem; border: 1px solid #1a1a1a; background: #fff; color: #1a1a1a; cursor: pointer; letter-spacing: 0.06em; text-transform: uppercase; }
.captcha-confirm { background: #1a1a1a; color: #fff; }
.captcha-confirm:disabled { opacity: 0.5; cursor: default; }
body.modal-open { overflow: hidden; }
</style>
</head>
<body>
<header>
<div class="topbar">
<h1><a href="{{ "/" | relLangURL }}">{{ .Site.Title }}</a></h1>
<nav class="lang-toggle">
{{- range .Translations -}}
<a href="{{ .RelPermalink }}" hreflang="{{ .Lang }}">{{ upper .Lang }}</a>
{{- end -}}
</nav>
</div>
<p class="subtitle">{{ i18n "subtitle" }}</p>
</header>
<main>
{{ block "main" . }}{{ end }}
</main>
<footer>
<p>{{ i18n "footer_lead" }} <a href="{{ printf "mailto:d@icke.xyz?subject=%s&body=%s" (i18n "mail_subject_encoded") (i18n "mail_body_encoded") | safeURL }}">{{ i18n "footer_link" }}</a>.</p>
</footer>
<div class="page-fence" aria-hidden="true"></div>
<script>
window.GBLabels = {y1:"{{ i18n "year_singular" }}",yN:"{{ i18n "year_plural" }}",m1:"{{ i18n "month_singular" }}",mN:"{{ i18n "month_plural" }}",d1:"{{ i18n "day_singular" }}",dN:"{{ i18n "day_plural" }}"};
window.GBRenderAges = function () {
  var lab = window.GBLabels;
  var els = document.querySelectorAll(".age");
  function parseDate(value) {
    var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(value || "");
    if (!m) return new Date(value);
    return new Date(Number(m[1]), Number(m[2]) - 1, Number(m[3]));
  }
  function dayNumber(date) {
    return Math.floor(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()) / 86400000);
  }
  function diff(s, e) {
    var a = parseDate(s), n = e ? parseDate(e) : new Date();
    var y = n.getFullYear() - a.getFullYear();
    var m = n.getMonth() - a.getMonth();
    var d = n.getDate() - a.getDate();
    if (d < 0) { m -= 1; d += new Date(n.getFullYear(), n.getMonth(), 0).getDate(); }
    if (m < 0) { y -= 1; m += 12; }
    return [y, m, d];
  }
  function elapsedDays(s, e) {
    return dayNumber(e ? parseDate(e) : new Date()) - dayNumber(parseDate(s));
  }
  function p(n, sg, pl) { return n + " " + (n === 1 ? sg : pl); }
  for (var i = 0; i < els.length; i++) {
    var x = diff(els[i].dataset.startDate, els[i].dataset.endDate);
    els[i].dataset.rankDays = elapsedDays(els[i].dataset.startDate, els[i].dataset.endDate);
    els[i].textContent = p(x[0], lab.y1, lab.yN) + ", " + p(x[1], lab.m1, lab.mN) + ", " + p(x[2], lab.d1, lab.dN);
  }
};
window.GBRenderAges();
setInterval(window.GBRenderAges, 60000);
</script>
{{ block "scripts" . }}{{ end }}
</body>
</html>
