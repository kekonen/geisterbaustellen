name = "geisterbaustellen"
compatibility_date = "2025-01-01"
pages_build_output_dir = "public"

# Replace `id` with the actual KV namespace ID after creating it:
#   wrangler kv namespace create PETITIONS
# or create it in the Cloudflare dashboard and bind it to the Pages project
# under Settings -> Functions -> KV namespace bindings (binding name: PETITIONS).
[[kv_namespaces]]
binding = "PETITIONS"
id = "REPLACE_WITH_KV_NAMESPACE_ID"
